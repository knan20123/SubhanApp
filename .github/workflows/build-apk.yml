name: Build Kivy APK

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
    - name: 📥 تحميل الكود من المستودع
      uses: actions/checkout@v4

    - name: 🐍 إعداد Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 📦 تثبيت الحزم الأساسية
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev --fix-missing

    - name: ⚙️ تثبيت Buildozer
      run: |
        pip install --upgrade pip
        pip install buildozer cython

    - name: 🔨 بناء APK
      run: buildozer -v android debug

    - name: 📤 رفع APK
      uses: actions/upload-artifact@v4
      with:
        name: subhan-app
        path: bin/*.apk
