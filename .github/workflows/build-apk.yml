name: Build Kivy APK

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
    - name: 📥 تحميل الكود
      uses: actions/checkout@v4

    - name: 🐍 إعداد Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 📦 تثبيت الحزم الأساسية
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev --fix-missing

    - name: 🤖 تثبيت Android SDK و Build Tools مع إعداد aidl
      run: |
        cd $HOME
        # تنزيل command line tools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
        mkdir -p android-sdk/cmdline-tools
        unzip -q commandlinetools-linux-9477386_latest.zip -d android-sdk/cmdline-tools
        mv android-sdk/cmdline-tools/cmdline-tools android-sdk/cmdline-tools/latest
        
        # إعداد المتغيرات
        export ANDROID_SDK_ROOT=$HOME/android-sdk
        export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin
        
        # الموافقة على التراخيص
        yes | sdkmanager --licenses > /dev/null 2>&1
        
        # تثبيت المنصات وأدوات البناء
        sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
        
        # إنشاء رابط رمزي لـ aidl في المكان الذي يتوقعه Buildozer
        mkdir -p $ANDROID_SDK_ROOT/build-tools
        ln -sf $ANDROID_SDK_ROOT/build-tools/34.0.0/aidl $ANDROID_SDK_ROOT/build-tools/aidl
        ln -sf $ANDROID_SDK_ROOT/build-tools/34.0.0/aidl $ANDROID_SDK_ROOT/platform-tools/aidl
        
        # إضافة aidl إلى PATH
        export PATH=$PATH:$ANDROID_SDK_ROOT/build-tools/34.0.0

    - name: 💾 Cache Buildozer
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          buildozer-${{ runner.os }}-

    - name: ⚙️ تثبيت Buildozer
      run: |
        pip install --upgrade pip
        pip install buildozer cython==0.29.33

    - name: 🔨 بناء APK
      run: |
        export ANDROID_SDK_ROOT=$HOME/android-sdk
        export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/build-tools/34.0.0
        # التحقق من وجود aidl
        which aidl || echo "aidl not found, but continuing"
        buildozer -v android debug

    - name: 📤 رفع APK
      uses: actions/upload-artifact@v4
      with:
        name: subhan-app
        path: bin/*.apk
