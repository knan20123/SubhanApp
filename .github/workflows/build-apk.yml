name: Build Kivy APK

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
    - name: 📥 تحميل الكود
      uses: actions/checkout@v4

    - name: 🐍 إعداد Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 📦 تثبيت الحزم الأساسية
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev --fix-missing

    - name: 🤖 تثبيت Android SDK مع Build Tools 30.0.3
      run: |
        cd $HOME
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
        mkdir -p android-sdk/cmdline-tools
        unzip -q commandlinetools-linux-9477386_latest.zip -d android-sdk/cmdline-tools
        mv android-sdk/cmdline-tools/cmdline-tools android-sdk/cmdline-tools/latest
        export ANDROID_SDK_ROOT=$HOME/android-sdk
        export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin
        yes | sdkmanager --licenses > /dev/null 2>&1
        sdkmanager "platform-tools" "platforms;android-33" "build-tools;30.0.3"

    - name: 💾 Cache Buildozer
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          buildozer-${{ runner.os }}-

    - name: ⚙️ تثبيت Buildozer
      run: |
        pip install --upgrade pip
        pip install buildozer cython==0.29.33

    - name: 🔨 بناء APK (مع مسار aidl المحدد)
      run: |
        export ANDROID_SDK_ROOT=$HOME/android-sdk
        export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/build-tools/30.0.3
        # التأكد من وجود aidl
        if [ -f "$ANDROID_SDK_ROOT/build-tools/30.0.3/aidl" ]; then
          echo "✅ aidl موجود في build-tools/30.0.3/"
          # نسخ aidl إلى مكان آمن
          mkdir -p $ANDROID_SDK_ROOT/build-tools
          cp $ANDROID_SDK_ROOT/build-tools/30.0.3/aidl $ANDROID_SDK_ROOT/build-tools/
          chmod +x $ANDROID_SDK_ROOT/build-tools/aidl
        else
          echo "❌ aidl غير موجود، جاري البحث..."
          find $ANDROID_SDK_ROOT -name "aidl" 2>/dev/null
          exit 1
        fi
        # إضافة مسار aidl إلى buildozer.spec
        echo "android.aidl = $ANDROID_SDK_ROOT/build-tools/30.0.3/aidl" >> buildozer.spec
        # إظهار محتوى buildozer.spec للتأكد
        cat buildozer.spec | grep -E "android.api|android.minapi|android.ndk|android.aidl"
        # بناء APK
        buildozer -v android debug

    - name: 📤 رفع APK
      uses: actions/upload-artifact@v4
      with:
        name: subhan-app
        path: bin/*.apk
