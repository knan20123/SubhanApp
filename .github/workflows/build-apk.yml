name: Build Kivy APK

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
    - name: 📥 تحميل الكود
      uses: actions/checkout@v4

    - name: 🐍 إعداد Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 📦 تثبيت الحزم الأساسية
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev --fix-missing

    - name: 🤖 تثبيت Android SDK و Build Tools
      run: |
        cd $HOME
        # تنزيل command line tools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
        mkdir -p android-sdk/cmdline-tools
        unzip -q commandlinetools-linux-9477386_latest.zip -d android-sdk/cmdline-tools
        mv android-sdk/cmdline-tools/cmdline-tools android-sdk/cmdline-tools/latest
        
        # إعداد المتغيرات
        export ANDROID_SDK_ROOT=$HOME/android-sdk
        export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin
        
        # الموافقة على التراخيص
        yes | sdkmanager --licenses > /dev/null 2>&1
        
        # تثبيت جميع إصدارات Build Tools (الأمر الجديد)
        sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.0" "build-tools;33.0.1" "build-tools;33.0.2" "build-tools;34.0.0"

    - name: 💾 Cache Buildozer
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          buildozer-${{ runner.os }}-

    - name: ⚙️ تثبيت Buildozer
      run: |
        pip install --upgrade pip
        pip install buildozer cython==0.29.33

    - name: 🔨 بناء APK
      run: |
        export ANDROID_SDK_ROOT=$HOME/android-sdk
        export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/build-tools/33.0.2
        # نسخ aidl إلى مكان يمكن لـ Buildozer العثور عليه
        if [ -f "$ANDROID_SDK_ROOT/build-tools/33.0.2/aidl" ]; then
          mkdir -p $ANDROID_SDK_ROOT/build-tools
          cp $ANDROID_SDK_ROOT/build-tools/33.0.2/aidl $ANDROID_SDK_ROOT/build-tools/
          chmod +x $ANDROID_SDK_ROOT/build-tools/aidl
          echo "✅ تم نسخ aidl إلى build-tools/"
        else
          echo "❌ aidl غير موجود، سيتم البحث..."
          find $ANDROID_SDK_ROOT -name "aidl" 2>/dev/null
        fi
        buildozer -v android debug

    - name: 📤 رفع APK
      uses: actions/upload-artifact@v4
      with:
        name: subhan-app
        path: bin/*.apk
